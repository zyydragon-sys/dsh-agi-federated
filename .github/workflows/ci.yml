name: ci

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  selftest:
    name: self-test (${{ matrix.plugin }} / ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        plugin: [dsh-arch-01-baseline, dsh-workbench-templates]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check client.js

      - name: Manifest is valid JSON
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(!p.name||!p.version)process.exit(1);console.log(p.name+' '+p.version)"

      - name: Patch file present
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const f=p.dsh&&p.dsh.bundle&&p.dsh.bundle.patch;if(!f||!fs.existsSync(f))process.exit(1);console.log('patch '+f)"

  drift:
    name: remote matches local
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compare local tree with GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/monitor.mjs

  file-ticket:
    name: open darwin ticket on failure
    needs: [selftest, drift]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = `darwin-ticket: CI failed on ${context.ref}`
            const body = [
              '## 来自 CI 的自动工单',
              '',
              `- 分支：\`${context.ref}\``,
              `- 提交：\`${context.sha}\``,
              `- 运行：${runUrl}`,
              '',
              '### 复现（本地）',
              '\`\`\`bash',
              'node --check plugins/dsh-arch-01-baseline/lib/index.js',
              'node scripts/monitor.mjs --verbose',
              '\`\`\`',
            ].join('\n')

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'darwin-ticket',
              per_page: 100,
            })
            const same = existing.find((issue) => issue.title === title)
            if (same) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: same.number,
                body: `再次失败：${runUrl}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['darwin-ticket'],
              })
            }
