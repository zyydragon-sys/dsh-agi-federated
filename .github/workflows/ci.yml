name: ci

on:
  push:
    branches: [main]
    paths:
      - 'plugins/dsh-quota-nexus/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'plugins/dsh-quota-nexus/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  selftest:
    name: self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/dsh-quota-nexus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check schemas/config.js
          node --check scripts/selftest.mjs

      - name: Manifest is valid JSON
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version) process.exit(1); console.log(p.name + ' ' + p.version)"

      - name: Self test (no third-party deps)
        run: node scripts/selftest.mjs

  drift:
    name: remote matches local
    # Read-only comparison of the checked-out tree against api.github.com.
    # Skipped on pull_request: a fork's token cannot read the upstream tree reliably.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compare local tree with GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/monitor.mjs

  file-ticket:
    name: open darwin ticket on failure
    # Failure → ticket，而不是失败即消失：任何 selftest/drift 红灯都会落成一张
    # 带 `darwin-ticket` 标签的 issue，本地用 scripts/ci-doctor.mjs 取回。
    # 人类确认前不会晋级任何技能（晋级只有 darwin_promote(confirm) 一条路）。
    needs: [selftest, drift]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = `darwin-ticket: CI failed on ${context.ref}`
            const body = [
              '## 来自 CI 的自动工单',
              '',
              `- 分支：\`${context.ref}\``,
              `- 提交：\`${context.sha}\``,
              `- 运行：${runUrl}`,
              `- 触发：${context.eventName}`,
              '',
              '### 复现（本地）',
              '```bash',
              'node plugins/dsh-quota-nexus/scripts/selftest.mjs',
              'node scripts/monitor.mjs --verbose',
              '```',
              '',
              '### 处置流程',
              '1. 本地 `node scripts/ci-doctor.mjs` 拉回本工单；',
              '2. `darwin_scan` → `darwin_forge` → `darwin_eval`（P2 门，≥80% 才可能晋级）；',
              '3. **人工确认**后才 `darwin_promote { confirm: true }`；',
              '4. 技能写进 `.dsh/skills/<name>/SKILL.md`，可用 `darwin_rollback` 回滚。',
            ].join('\n')

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'darwin-ticket',
              per_page: 100,
            })
            const same = existing.find((issue) => issue.title === title)
            if (same) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: same.number,
                body: `再次失败：${runUrl}`,
              })
              core.info(`已在该工单追加评论：#${same.number}`)
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['darwin-ticket'],
              })
              core.info(`已开工单 #${issue.number}`)
            }

